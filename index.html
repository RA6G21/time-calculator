<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero Decimal Time Calculator</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RYP6HDMH84"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-RYP6HDMH84');
    </script>
</head>
<body>
    <header class="site-header">
        <img class="top-right-image" src="aero.png" alt="Aero">
    </header>

    <main class="container">
        <h1>Aero Decimal Time Calculator</h1>

        <p class="instructions">
            Enter hours and minutes separated by a dot.
            <strong>1.30</strong> or <strong>1.3</strong> means 1 hour 30 minutes.
        </p>

        <section class="operation" aria-labelledby="addHeading">
            <h2 id="addHeading">Add Time</h2>
            <form id="addForm">
                <label for="addInput">Times to add</label>
                <input id="addInput" type="text" placeholder="e.g. 1.30 + 2.40"
                       autocomplete="off" required>
                <button type="submit">Calculate</button>
            </form>
            <div id="addResult" class="result" aria-live="polite"></div>
            <div id="addCopyControls" class="copy-controls" hidden>
                <button id="addCopy" class="copy-button" type="button">Copy for Excel</button>
                <p id="addCopyStatus" class="copy-status" role="status"></p>
                <input id="addManualCopy" aria-label="Result to copy" readonly hidden>
            </div>
        </section>

        <section class="operation" aria-labelledby="subHeading">
            <h2 id="subHeading">Subtract Time</h2>
            <form id="subForm">
                <label for="subInput">Times to subtract</label>
                <input id="subInput" type="text" placeholder="e.g. 5.20 - 1.40 - 0.30"
                       autocomplete="off" required>
                <button type="submit">Calculate</button>
            </form>
            <div id="subResult" class="result" aria-live="polite"></div>
            <div id="subCopyControls" class="copy-controls" hidden>
                <button id="subCopy" class="copy-button" type="button">Copy for Excel</button>
                <p id="subCopyStatus" class="copy-status" role="status"></p>
                <input id="subManualCopy" aria-label="Result to copy" readonly hidden>
            </div>
        </section>
    </main>

    <script src="script4.js"></script>
    <script>
        function connectCalculator(prefix, calculate, operation) {
            const form = document.getElementById(prefix + 'Form');
            const input = document.getElementById(prefix + 'Input');
            const result = document.getElementById(prefix + 'Result');
            const controls = document.getElementById(prefix + 'CopyControls');
            const copyButton = document.getElementById(prefix + 'Copy');
            const status = document.getElementById(prefix + 'CopyStatus');
            const manualCopy = document.getElementById(prefix + 'ManualCopy');
            let value = '';
            let revision = 0;

            function clearResult() {
                revision++;
                value = '';
                result.textContent = '';
                status.textContent = '';
                manualCopy.value = '';
                manualCopy.hidden = true;
                controls.hidden = true;
            }

            input.addEventListener('input', clearResult);

            form.addEventListener('submit', event => {
                event.preventDefault();
                clearResult();
                calculate();

                // The original calculator displays H:MM first.
                const match = result.textContent.trim().match(/^[-−]?\d+:[0-5]\d/);
                if (match) {
                    value = match[0].replace('−', '-');
                    copyButton.textContent = 'Copy for Excel (' + value + ')';
                    controls.hidden = false;
                }

                gtag('event', 'calculate', { operation });
            });

            copyButton.addEventListener('click', async () => {
                if (!value) return;

                const copiedValue = value;
                const copyRevision = revision;

                try {
                    await navigator.clipboard.writeText(copiedValue);
                    if (copyRevision !== revision) return;
                    manualCopy.hidden = true;
                    status.textContent = 'Copied ' + copiedValue + '.';
                } catch {
                    if (copyRevision !== revision) return;
                    manualCopy.value = copiedValue;
                    manualCopy.hidden = false;
                    manualCopy.focus();
                    manualCopy.select();
                    status.textContent = 'Press Ctrl+C or Cmd+C to copy.';
                }
            });
        }

        connectCalculator('add', addTimes, 'addition');
        connectCalculator('sub', subtractTimes, 'subtraction');
    </script>
</body>
</html>
