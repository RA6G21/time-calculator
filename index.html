<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero Flight Time Calculator</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RYP6HDMH84"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            window.dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', 'G-RYP6HDMH84');
    </script>

    <script src="script4.js" defer></script>
</head>
<body>
    <div class="page">
        <header class="site-header">
            <h1>Aero Flight Time Calculator</h1>
            <img class="aero-logo" src="aero.png" alt="Aero">
        </header>

        <main>
            <div class="workspace">
                <section class="card" aria-label="Flight time entry">
                    <div class="button-row modes" role="group" aria-label="Calculator mode">
                        <button type="button" id="add" aria-pressed="true">Add time</button>
                        <button type="button" id="subtract" aria-pressed="false">Subtract time</button>
                    </div>

                    <form id="calculator" novalidate>
                        <label for="expression">Flight time expression</label>
                        <p class="hint" id="format-hint">
                            Enter hours and minutes. <strong>1.30</strong> or
                            <strong>1.3</strong> means 1 hour 30 minutes.
                            You can use + and − in the same expression.
                        </p>
                        <input
                            id="expression"
                            type="text"
                            placeholder="e.g. 1.3 + 2.4"
                            maxlength="500"
                            autocomplete="off"
                            spellcheck="false"
                            aria-describedby="format-hint input-error"
                        >
                        <p id="input-error" class="error" aria-live="polite" hidden></p>

                        <div class="button-row">
                            <button class="primary" type="submit">Calculate</button>
                            <button type="button" id="example">Try example</button>
                            <button type="button" id="clear">Clear</button>
                        </div>
                    </form>
                </section>

                <section class="card" aria-labelledby="result-heading">
                    <h2 id="result-heading">Result</h2>

                    <div class="result-panel" aria-live="polite">
                        <p class="result-number" id="total" hidden></p>
                        <p id="result-message">Enter flight times to calculate a total.</p>
                    </div>

                    <div class="copy-controls">
                        <label for="excel-format">Excel format</label>
                        <select id="excel-format">
                            <option value="minutes">Total minutes</option>
                            <option value="decimal">Decimal hours (4 decimal places)</option>
                            <option value="duration">Hours and minutes (H:MM)</option>
                            <option value="dot">Hours and minutes (H.MM)</option>
                        </select>
                        <p class="hint" id="copy-preview">Choose the format your worksheet uses.</p>
                        <button id="copy" type="button" disabled>Copy for Excel</button>
                        <p class="hint" id="copy-status" role="status"></p>
                        <input id="manual-copy" aria-label="Value to copy for Excel" readonly hidden>
                    </div>

                    <div class="table-wrap" id="breakdown" tabindex="0"
                         role="region" aria-label="Calculation breakdown" hidden>
                        <table>
                            <caption>Calculation breakdown</caption>
                            <thead>
                                <tr>
                                    <th scope="col">Entry</th>
                                    <th scope="col">Read as</th>
                                    <th scope="col">Running total</th>
                                </tr>
                            </thead>
                            <tbody id="steps"></tbody>
                        </table>
                    </div>
                </section>
            </div>

            <section class="card history" id="history" aria-labelledby="history-heading" hidden>
                <h2 id="history-heading">Recent calculations</h2>
                <ul id="recent"></ul>
            </section>
        </main>
    </div>
</body>
</html>
